# 🏷️ Auto-labels based on changed paths (actions/labeler v6 syntax)

# Client application source
frontend:
  - changed-files:
      - any-glob-to-any-file: ['apps/client/**']

# Documentation / Storybook / Stories / Markdown
docs:
  - changed-files:
      - any-glob-to-any-file:
          [
            'apps/docs/**',
            '.storybook/**',
            '**/*.stories.ts',
            '**/*.stories.tsx',
            '**/*.md',
          ]

# End-to-end tests (Playwright)
e2e:
  - changed-files:
      - any-glob-to-any-file:
          ['tests/**', 'playwright/**', 'playwright.config.ts']

# Unit tests
unit-test:
  - changed-files:
      - any-glob-to-any-file:
          [
            'apps/client/**/*.test.ts',
            'apps/client/**/*.test.tsx',
            'apps/client/**/*.spec.ts',
          ]

# CI/CD workflows and config
ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/workflows/**', '.github/labeler.yml']

# Root-level config files (except pnpm-lock.yaml)
config:
  - all:
      - changed-files:
          - any-glob-to-any-file:
              ['*.yml', '*.yaml', '*.json', '.node-version']
          - all-globs-to-all-files: '!pnpm-lock.yaml'
# Dependency changes
deps:
  - changed-files:
      - any-glob-to-any-file:
          [
            'package.json',
            'pnpm-lock.yaml',
            'pnpm-workspace.yaml',
            'apps/*/package.json',
          ]
