name: Frontend CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'apps/docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'apps/docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.display }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['lts/*']
        include:
          - task: format:check
            display: Check formatting
          - task: lint
            display: Lint
          - task: typecheck
            display: Typecheck
          - task: test
            display: Test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.display }}
        run: pnpm run ${{ matrix.task }}
